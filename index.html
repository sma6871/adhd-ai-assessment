<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADHD Self-Screening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #FBFBFB;
    --text: #1A1A1A;
    --heading: #171717;
    --body: #737373;
    --muted: #A3A3A3;
    --border: #E5E5E5;
    --line: #F5F5F5;
    --white: #FFFFFF;
  }
  html, body { height: 100%; }
  body {
    background: #EBEBEA;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  html[lang="fa"] body, html[lang="fa"] .device, html[lang="fa"] button { font-family: "Vazirmatn", "Inter", sans-serif; }

  .device {
    width: 390px; height: 844px; background: var(--bg);
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,0.10);
  }

  /* ---------- welcome header: brand + merged language pill ---------- */
  .hd-welcome { padding: 96px 24px 32px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .hd-welcome h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; text-align: center; }

  .lang-pill {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--white); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px;
  }
  .lang-opt {
    display: inline-flex; align-items: center; gap: 8px;
    border: none; background: none; cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: 500; color: var(--text);
    padding: 8px 14px; border-radius: 999px;
  }
  .lang-opt .lang-radio {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid var(--border); flex: none; position: relative;
  }
  .lang-opt.selected { color: var(--heading); }
  .lang-opt.selected .lang-radio { border-color: var(--heading); }
  .lang-opt.selected .lang-radio::after {
    content: ''; position: absolute; inset: 3px; border-radius: 50%;
    background: var(--heading);
  }
  .lang-opt:not(.selected) { opacity: 0.4; }
  .lang-opt .lang-label { white-space: nowrap; }
  .lang-opt .lang-label.lang-fa { font-family: "Vazirmatn", "Inter", sans-serif; }
  .lang-divider { width: 1px; height: 18px; background: var(--border); }

  /* ---------- generic headers ---------- */
  .hd-bare { padding: 64px 24px 16px; display: flex; justify-content: center; }
  .hd-bare h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; text-align: center; }

  .hd-top { padding: 48px 24px 16px; }
  .hd-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .btn-back {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--white); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .btn-back svg { width: 16px; height: 16px; stroke: var(--heading); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  html[dir="rtl"] .btn-back svg { transform: scaleX(-1); }
  .hd-title { font-size: 14px; font-weight: 700; color: var(--heading); }
  .hd-spacer { width: 40px; }

  .dots { display: flex; justify-content: center; gap: 8px; margin-top: 8px; }
  .dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 1px solid var(--border); background: transparent;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .dot.done, .dot.active { background: var(--heading); border: 2px solid var(--heading); }
  .dot.done svg { width: 9px; height: 9px; fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

  main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  main.q { display: flex; flex-direction: column; overflow: hidden; }
  main.q .ctx-row { flex: none; }
  main.q .question-box { flex: none; }
  main.q .answers { flex: 1 1 auto; min-height: 0; }
  main.q .answer-row { height: 70px; min-height: 56px; flex: 0 1 auto; }

  /* ---------- welcome / how-to content ---------- */
  .welcome { padding: 4px 40px; display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center; }
  .welcome .lead { font-size: 20px; font-weight: 700; line-height: 1.5; color: var(--heading); }
  .welcome p { font-size: 15px; line-height: 1.7; color: var(--body); }
  .welcome .screening { font-size: 15px; font-weight: 700; color: var(--body); }
  .time-row { display: inline-flex; align-items: center; gap: 8px; color: var(--body); font-size: 14px; margin-top: 4px; }
  .time-row svg { width: 15px; height: 15px; fill: var(--body); }
  .privacy { display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; margin-top: 4px; }
  .privacy .lock { width: 48px; height: 48px; border-radius: 16px; background: var(--line); display: flex; align-items: center; justify-content: center; }
  .privacy .lock svg { width: 20px; height: 20px; fill: var(--muted); }
  .privacy .privacy-label { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
  .crisis { font-size: 12px; line-height: 1.7; color: var(--muted); max-width: 310px; }

  .how { padding: 40px 32px 0; display: flex; flex-direction: column; gap: 48px; }
  .how-heading { font-size: 30px; font-weight: 700; line-height: 1.3; color: var(--heading); }
  .how-items { display: flex; flex-direction: column; gap: 40px; }
  .how-item { display: flex; align-items: flex-start; gap: 20px; }
  .how-icon { width: 48px; height: 48px; border-radius: 50%; background: var(--line); display: flex; align-items: center; justify-content: center; flex: none; color: var(--heading); }
  .how-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .how-txt { display: flex; flex-direction: column; gap: 4px; }
  .how-txt h3 { font-size: 18px; font-weight: 700; line-height: 1.4; color: var(--heading); }
  .how-txt p { font-size: 14px; line-height: 1.7; color: var(--body); }

  /* ---------- question screen ---------- */
  .ctx-row { display: flex; align-items: center; justify-content: space-between; padding: 24px 32px 0; margin-bottom: 12px; }
  .ctx-count { font-size: 12px; font-weight: 500; color: var(--muted); }
  .help-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--line); border: none; border-radius: 999px; padding: 6px 16px;
    font-family: inherit; font-size: 10px; font-weight: 700; color: var(--text); cursor: pointer;
  }
  .help-pill svg { width: 12px; height: 12px; fill: var(--muted); }
  .help-pill.expanded { background: var(--heading); color: var(--white); }
  .help-pill.expanded svg { fill: var(--white); transform: rotate(45deg); }

  .question-box { padding: 0 32px; margin-bottom: 32px; display: flex; flex-direction: column; gap: 16px; }
  .question-text { font-size: 18px; font-weight: 700; line-height: 1.6; color: var(--heading); }
  .help-text { font-size: 12px; font-style: italic; line-height: 1.7; color: var(--muted); border-inline-start: 2px solid var(--line); padding-inline-start: 16px; }

  .answers { padding: 0 32px 8px; display: flex; flex-direction: column; gap: 12px; }
  .answer-row {
    width: 100%; height: 70px; background: var(--white);
    border: 1px solid var(--line); border-radius: 20px; padding: 0 24px;
    font-family: inherit; font-size: 18px; font-weight: 500; color: var(--text); text-align: start;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04); cursor: pointer;
    transition: border-color .15s ease;
  }
  .answer-row:hover { border-color: var(--border); }
  .answer-row.selected { border: 2px solid var(--heading); font-weight: 700; padding: 0 22px; }
  .answer-check { display: none; flex: none; width: 24px; height: 24px; }
  .answer-row.selected .answer-check { display: block; }
  .answer-check svg { width: 24px; height: 24px; }

  /* ---------- result ---------- */
  .result-wrap { padding: 8px 40px; display: flex; flex-direction: column; justify-content: center; gap: 14px; flex: 1; }
  .result-label { font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 4px; }
  .result-head { font-size: 30px; font-weight: 700; line-height: 1.25; letter-spacing: -0.02em; color: var(--heading); margin-bottom: 6px; }
  .result-body { font-size: 18px; line-height: 1.625; color: var(--body); margin-bottom: 8px; }
  .result-note { font-size: 14px; line-height: 1.625; color: var(--body); }

  /* ---------- footer ---------- */
  footer { padding: 32px 32px 40px; display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .primary {
    width: 100%; padding: 20px 0; background: var(--heading); color: var(--white);
    border: none; border-radius: 16px; font-family: inherit; font-size: 18px; font-weight: 700; letter-spacing: -0.01em;
    box-shadow: 0 20px 25px -5px rgba(229,229,229,1), 0 8px 10px -6px rgba(229,229,229,1);
    cursor: pointer; transition: transform .12s ease;
  }
  .primary:active { transform: scale(0.98); }
  .primary:disabled { background: var(--border); color: var(--muted); box-shadow: none; cursor: not-allowed; }
  .secondary { background: none; border: none; font-family: inherit; font-size: 14px; font-weight: 500; color: var(--body); text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 4px; cursor: pointer; }
  .disclaimer { font-size: 12px; font-weight: 500; color: var(--muted); }
</style>

<script>
/* ================= state ================= */
var state = {
  lang: 'en',
  screen: 'welcome', // welcome | howto | question | results
  qIndex: 0,
  answers: [null, null, null, null, null, null],
  showHelp: true
};
var app = document.getElementById('app');

function t() { return LANG[state.lang]; }
function faDigits(s) { return String(s).replace(/\d/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'[d]; }); }
function num(n) { return state.lang === 'fa' ? faDigits(n) : String(n); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* ASRS v1.1 screener scoring */
/* Q1-3: Sometimes(2)/Often(3)/VeryOften(4). Q4-6: Often(3)/VeryOften(4). count>=4 => positive */
window.asrsScore = function (answers) {
  var c = 0;
  for (var i = 0; i < answers.length; i++) {
    if (answers[i] == null) continue;
    if (i < 3 ? answers[i] >= 2 : answers[i] >= 3) c++;
  }
  return c;
};
window.asrsOutcome = function (answers) { return asrsScore(answers) >= 4 ? 'positive' : 'negative'; };
</script>

  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.3-3.6 4-5.5 7.5-5.5s6.2 1.9 7.5 5.5"/></svg>',
  checkCircleOut: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7 5.3-6"/></svg>'
};
function icon(id) { return S[id] || ''; }
</script>

<script>
/* ================= screens ================= */
function langPill() {
  var opts = state.lang === 'fa'
    ? [['fa', 'فارسی'], ['en', 'English']]
    : [['en', 'English'], ['fa', 'فارسی']];
  var parts = [];
  for (var i = 0; i < opts.length; i++) {
    var code = opts[i][0], label = opts[i][1];
    parts.push(
      '<button class="lang-opt' + (state.lang === code ? ' selected' : '') + '" data-lang="' + code + '" tabindex="0" role="radio" aria-checked="' + (state.lang === code) + '">' +
        '<span class="lang-radio"></span>' +
        '<span class="lang-label' + (code === 'fa' ? ' lang-fa' : '') + '">' + esc(label) + '</span>' +
      '</button>'
    );
    if (i === 0) parts.push('<span class="lang-divider"></span>');
  }
  return '<div class="lang-pill" role="radiogroup">' + parts.join('') + '</div>';
}

function sWelcome() {
  var g = t();
  return '' +
    '<header class="hd-welcome"><h1>' + esc(g.brand) + '</h1>' + langPill() + '</header>' +
    '<main><div class="welcome">' +
      '<p class="lead">' + esc(g.lead) + '</p>' +
      g.welcome.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') +
      '<span class="time-row">' + S.clock + '<span>' + esc(g.howTime) + '</span></span>' +
      '<p class="screening">' + esc(g.disclaimer) + '</p>' +
      '<div class="privacy"><span class="lock">' + S.lock + '</span><span class="privacy-label">' + esc(g.privacyLabel) + '</span></div>' +
      '<p class="crisis">' + esc(g.crisis) + '</p>' +
    '</div></main>' +
    '<footer><button class="primary" data-action="toHow">' + esc(g.startLabel) + '</button></footer>';
}

function sHow() {
  var g = t();
  var itemIcons = [S.calendar, S.user, S.checkCircleOut];
  var items = g.howItems.map(function (it, idx) {
    return '<div class="how-item">' +
      '<span class="how-icon">' + itemIcons[idx] + '</span>' +
      '<div class="how-txt"><h3>' + esc(it.t) + '</h3><p>' + esc(it.d) + '</p></div>' +
    '</div>';
  }).join('');
  return '' +
    '<header class="hd-top"><div class="hd-row">' +
      '<button class="btn-back" data-action="back">' + S.back + '</button>' +
      '<span class="hd-title">' + esc(g.brand) + '</span>' +
      '<span class="hd-spacer"></span>' +
    '</div></header>' +
    '<main><div class="how">' +
      '<h2 class="how-heading">' + esc(g.howTitle) + '</h2>' +
      '<div class="how-items">' + items + '</div>' +
      '<span class="time-row">' + S.clock + '<span>' + esc(g.howTime) + '</span></span>' +
    '</div></main>' +
    '<footer>' +
      '<button class="primary" data-action="begin">' + esc(g.beginLabel) + '</button>' +
      '<p class="disclaimer">' + esc(g.disclaimer) + '</p>' +
    '</footer>';
}

function sQuestion() {
  var g = t(), i = state.qIndex;
  var q = g.questions[i];

  var dots = '';
  for (var d = 0; d < 6; d++) {
    dots += '<span class="dot' + (d < i ? ' done' : (d === i ? ' active' : '')) + '">' +
      (d < i ? S.dotCheck : '') + '</span>';
  }

  var ansHtml = g.answers.map(function (label, x) {
    var sel = state.answers[i] === x;
    return '<div class="answer-row' + (sel ? ' selected' : '') + '" tabindex="0" role="radio" data-answer="' + x + '">' +
      '<span>' + esc(label) + '</span>' +
      '<span class="answer-check">' + S.checkCircle + '</span>' +
    '</div>';
  }).join('');

  var cta = (i === 5) ? g.seeResultLabel : g.nextLabel;
  var ctxNum = g.questionLabel + ' ' + num(i + 1) + ' ' + g.of + ' ' + num(6);

  return '' +
    '<header class="hd-top"><div class="hd-row">' +
      '<button class="btn-back" data-action="back">' + S.back + '</button>' +
      '<span class="hd-title">' + esc(g.brand) + '</span>' +
      '<span class="hd-spacer"></span>' +
    '</div><div class="dots">' + dots + '</div></header>' +
    '<main class="q">' +
      '<div class="ctx-row">' +
        '<span class="ctx-count">' + esc(ctxNum) + '</span>' +
        '<button class="help-pill' + (state.showHelp ? ' expanded' : '') + '" data-action="toggleHelp">' + S.help + '<span>' + esc(g.helpLabel) + '</span></button>' +
      '</div>' +
      '<div class="question-box">' +
        '<p class="question-text">' + esc(q.q) + '</p>' +
        (state.showHelp ? '<p class="help-text">' + esc(q.help) + '</p>' : '') +
      '</div>' +
      '<div class="answers">' + ansHtml + '</div>' +
    '</main>' +
    '<footer><button class="primary" data-action="nextQ" id="cta"></button></footer>';
}

function sResult() {
  var g = t();
  var outcome = (state.screen === 'results') ? asrsOutcome(state.answers) : 'neutral';
  var r = outcome === 'positive' ? g.positive : g.negative;
  var head = outcome === 'positive' ? g.positive.heading : g.negative.heading;
  var body = outcome === 'positive' ? g.positive.body : g.negative.body;
  var note = outcome === 'positive' ? g.positive.note : g.negative.note;
  return '' +
    '<header class="hd-bare"><h1>' + esc(g.brand) + '</h1></header>' +
    '<main><div class="result-wrap">' +
      '<p class="result-label">' + esc(g.resultLabel) + '</p>' +
      '<h2 class="result-head">' + esc(head) + '</h2>' +
      '<p class="result-body">' + esc(body) + '</p>' +
      '<p class="result-note">' + esc(note) + '</p>' +
    '</div></main>' +
    '<footer>' +
      '<button class="primary" data-action="finish">' + esc(g.finishLabel) + '</button>' +
      '<button class="secondary" data-action="restart">' + esc(g.startAgainLabel) + '</button>' +
      '<p class="disclaimer">' + esc(g.disclaimer) + '</p>' +
    '</footer>';
}
</script>

<script>
/* ================= router ================= */
function render() {
  var g = t();
  document.documentElement.lang = state.lang;
  document.documentElement.dir = g.dir;
  document.title = state.screen === 'results'
    ? 'ADHD Self-Screening — Screening Result'
    : 'ADHD Self-Screening';

  var html;
  switch (state.screen) {
    case 'welcome':  html = sWelcome(); break;
    case 'howto':    html = sHow(); break;
    case 'question': html = sQuestion(); break;
    case 'results':  html = sResult(); break;
  }
  app.innerHTML = html;

  if (state.screen === 'question') {
    var cta = document.getElementById('cta');
    if (cta) {
      cta.textContent = (state.qIndex === 5)
        ? t().seeResultLabel
        : t().nextLabel;
      cta.disabled = state.answers[state.qIndex] == null;
    }
  }
}

app.addEventListener('click', function (e) {
  var langEl = e.target.closest('[data-lang]');
  if (langEl) {
    state.lang = langEl.getAttribute('data-lang');
    render();
    return;
  }

  var actEl = e.target.closest('[data-action]');
  if (actEl) {
    switch (actEl.getAttribute('data-action')) {
      case 'toHow':
        state.screen = 'howto';
        break;
      case 'back':
        if (state.screen === 'howto') { state.screen = 'welcome'; }
        else if (state.screen === 'question') {
          if (state.qIndex > 0) { state.qIndex--; state.showHelp = true; }
          else { state.screen = 'howto'; }
        }
        break;
      case 'begin':
        state.answers = [null, null, null, null, null, null];
        state.qIndex = 0; state.showHelp = true;
        state.screen = 'question';
        break;
      case 'toggleHelp':
        state.showHelp = !state.showHelp;
        break;
      case 'nextQ':
        if (state.answers[state.qIndex] == null) return;
        if (state.qIndex < 5) {
          state.qIndex++; state.showHelp = true;
        } else {
          state.screen = 'results';
        }
        break;
      case 'finish':
        state.screen = 'welcome';
        break;
      case 'restart':
        state.answers = [null, null, null, null, null, null];
        state.qIndex = 0; state.showHelp = true;
        state.screen = 'welcome';
        break;
    }
    render();
    return;
  }

  var ansEl = e.target.closest('[data-answer]');
  if (ansEl) {
    state.answers[state.qIndex] = parseInt(ansEl.getAttribute('data-answer'), 10);
    render();
  }
});

app.addEventListener('keydown', function (e) {
  if ((e.key === ' ' || e.key === 'Enter') && e.target.getAttribute('data-answer')) {
    e.preventDefault();
    e.target.click();
  }
});

render();
</script>
</body>
</html>
