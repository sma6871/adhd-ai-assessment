<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ADHD Assessment — Symptom Interview</title>
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<link rel="stylesheet" href="/design-tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Stage 2 — Focus-First Design System (design-tokens.css). Single-file app shell. */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
html { scroll-behavior: auto; }
html[lang="en"], html[lang="en"] body { font-family: var(--ff-font-body); }
html[lang="fa"], html[lang="fa"] body { font-family: var(--ff-font-persian); }
html[dir="rtl"] { text-align: right; }
/* Issue #2: override font-family vars for Persian so every element — headers,
   body, labels, badges, buttons, inputs, report — uses Vazirmatn.
   Do NOT add font declarations to individual elements; cascade via vars. */
html[lang="fa"] {
  --ff-font-body: var(--ff-font-persian);
  --ff-font-label: var(--ff-font-persian);
  --ff-font-display: var(--ff-font-persian);
  --ff-font-mono: var(--ff-font-persian);
}
body {
  background: var(--ff-surface);
  color: var(--ff-on-surface);
  display: flex; align-items: center; justify-content: center;
  -webkit-font-smoothing: antialiased;
}
.device {
  width: 390px; height: 844px;
  background: var(--ff-surface-container-lowest);
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 24px 60px rgba(0,0,0,0.10);
}

/* === Header: brand + compact overflow menu (focus-first, minimal) === */
.hd-brand { padding: 44px 24px 12px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; position: relative; }
.hd-brand h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: var(--ff-on-surface); margin: 0; }
.hd-actions { display: inline-flex; align-items: center; }
html[dir="rtl"] .hd-brand { flex-direction: row-reverse; }
.overflow { width: 38px; height: 38px; min-width: 0; padding: 0; border: 1px solid var(--ff-outline-variant); border-radius: var(--ff-radius-full); background: var(--ff-surface-container-lowest); color: var(--ff-on-surface-variant); font-size: 20px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: opacity .15s ease; }
.overflow:hover { opacity: .7; }
.header-menu { position: absolute; left: 0; top: 0; min-width: 180px; background: var(--ff-surface-container-lowest); border: 1px solid var(--ff-outline-variant); border-radius: var(--ff-radius-md); box-shadow: 0 8px 24px rgba(0,0,0,0.12); padding: 4px; z-index: 20; }
.header-menu-item { width: 100%; text-align: start; border: none; background: none; padding: 10px 14px; font-size: 14px; font-weight: 500; color: var(--ff-on-surface); border-radius: var(--ff-radius-sm); cursor: pointer; transition: background .12s ease; font-family: inherit; white-space: nowrap; }
.header-menu-item:hover { background: var(--ff-surface-container); }

/* === Stage sub-header + stage-aware progress === */
.hd-sub { padding: 8px 24px 4px; flex-shrink: 0; }
.stage-row { display: flex; align-items: baseline; justify-content: space-between; }
html[dir="rtl"] .stage-row { flex-direction: row-reverse; }
.stage-num { font-size: 13px; font-weight: 600; color: var(--ff-on-surface-variant); font-family: var(--ff-font-label); letter-spacing: .05em; }
.hd-sub h2 { font-size: 18px; font-weight: 600; color: var(--ff-on-surface); margin: 2px 0; line-height: 1.3; }
.hd-sub .sub-text { font-size: 12px; color: var(--ff-on-surface-variant); }
.progress-wrap { padding: 0 24px 8px; flex-shrink: 0; }
.progress-bar { height: 4px; background: var(--ff-surface-container); border-radius: var(--ff-radius-full); overflow: hidden; }
.progress-fill { height: 100%; background: var(--ff-secondary); border-radius: var(--ff-radius-full); width: 0%; transition: width .3s ease; }
.progress-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--ff-on-surface-variant); margin-top: 6px; font-family: var(--ff-font-label); letter-spacing: .05em; }
html[dir="rtl"] .progress-meta { flex-direction: row-reverse; }
.progress-label { font-weight: 600; opacity: .7; }
.stage-banner { margin: 6px 24px 10px; padding: 11px 14px; border-radius: var(--ff-radius-sm); background: var(--ff-surface-container-low); border: 1px solid var(--ff-outline-variant); font-size: 13px; color: var(--ff-on-surface-variant); font-style: italic; text-align: center; }

/* === Messages (scrollable) + input (persistent, sticky footer) === */
#messages { flex: 1 1 0; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 24px 4px; }
.msg { margin: 8px 0; padding: 12px 16px; border-radius: var(--ff-radius-lg); font-size: 16px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; max-width: 100%; }
.msg.ai { background: var(--ff-surface-container-low); border: 1px solid var(--ff-outline-variant); border-bottom-left-radius: 4px; align-self: flex-start; }
html[dir="rtl"] .msg.ai { border-bottom-left-radius: var(--ff-radius-lg); border-bottom-right-radius: 4px; }
.msg.user { background: var(--ff-surface-container-lowest); border: 1px solid var(--ff-outline-variant); border-bottom-right-radius: 4px; align-self: flex-end; }
html[dir="rtl"] .msg.user { border-bottom-right-radius: var(--ff-radius-lg); border-bottom-left-radius: 4px; }
.msg.transition { font-style: italic; color: var(--ff-on-surface-variant); }
.msg.criterion-done { font-size: 13px; color: var(--ff-on-surface-variant); }
.msg.error { color: var(--ff-error); }
.badge { display: inline-block; font-size: 11px; font-family: var(--ff-font-label); font-weight: 700; letter-spacing: .05em; background: var(--ff-secondary-container); color: var(--ff-on-secondary-container); border: 1px solid var(--ff-outline-variant); border-radius: var(--ff-radius-full); padding: 2px 8px; margin-inline-end: 6px; vertical-align: middle; }
html[dir="rtl"] .badge { margin-inline-end: 0; margin-inline-start: 6px; }
.msg .qs { display: block; }
.err { color: var(--ff-on-error-container); font-size: 13px; margin: 12px 0; padding: 10px 12px; background: var(--ff-error-container); border-radius: var(--ff-radius-sm); }
#input-slot { flex-shrink: 0; }
.input-area { padding: 12px 24px 20px; border-top: 1px solid var(--ff-outline-variant); background: var(--ff-surface-container-lowest); display: flex; gap: 12px; align-items: flex-end; }
.input-area textarea { flex: 1; min-height: 120px; max-height: 160px; padding: 12px 16px; border: 1px solid var(--ff-outline-variant); border-radius: var(--ff-radius-sm); background: var(--ff-surface-container-lowest); font-family: inherit; font-size: 16px; color: var(--ff-on-surface); resize: none; outline: none; transition: opacity .15s ease, border-color .15s ease; }
.input-area textarea:focus { border-color: var(--ff-secondary); box-shadow: 0 0 0 2px var(--ff-secondary-container); }
.input-area button { flex: none; padding: 12px 24px; background: var(--ff-primary); color: var(--ff-on-primary); border: none; border-radius: var(--ff-radius-sm); font-size: 16px; font-weight: 700; line-height: 24px; cursor: pointer; white-space: nowrap; transition: opacity .15s ease; }
.input-area button:disabled { opacity: .45; cursor: not-allowed; background: var(--ff-outline); color: var(--ff-on-surface-variant); }
.input-area button:hover:not(:disabled) { opacity: .85; }
.input-hint { padding: 0 24px 6px; font-size: 11px; color: var(--ff-on-surface-variant); font-family: var(--ff-font-label); letter-spacing: .05em; }
.freq-options { display: none; flex-wrap: wrap; gap: 6px; align-content: center; justify-content: center; width: 100%; opacity: 1; transition: opacity .15s ease; }
button.freq-opt { flex: 0 1 auto; min-width: 0; height: 36px; padding: 0 14px; border: 1px solid var(--ff-outline-variant); border-radius: var(--ff-radius-full); background: var(--ff-surface-container-lowest); color: var(--ff-on-surface); font-size: 14px; font-weight: 500; line-height: 36px; cursor: pointer; text-align: center; white-space: nowrap; transition: background .12s ease, border-color .15s ease, color .15s ease; outline: none; font-family: inherit; }
button.freq-opt:hover { background: var(--ff-secondary-container); border-color: var(--ff-secondary); color: var(--ff-on-secondary-container); }
button.freq-opt:focus-visible { border-color: var(--ff-secondary); box-shadow: 0 0 0 2px var(--ff-secondary-container); }
button.freq-opt:active { opacity: .8; }
html[dir="rtl"] .freq-options { direction: ltr; }
html[lang="fa"] button.freq-opt { font-family: var(--ff-font-persian); }

/* === Processing state (full-screen overlay after Stage 5) === */
#processing-overlay {
  position: fixed; inset: 0; z-index: 999;
  display: none;
  flex-direction: column; align-items: center; justify-content: center;
  background: var(--ff-surface-container-lowest);
  padding: 0 24px;
  text-align: center;
  pointer-events: none;
}
#processing-overlay:not([hidden]) {
  display: flex;
  pointer-events: auto;
}
#processing-overlay .proc-spinner {
  width: 32px; height: 32px; border: 2.5px solid var(--ff-outline-variant);
  border-top-color: var(--ff-secondary); border-radius: 50%;
  animation: procSpin 1s linear infinite;
  margin-bottom: 16px;
}
html[dir="rtl"] #processing-overlay .proc-spinner { transform: rotate(180deg); }
@keyframes procSpin { to { transform: rotate(360deg); } }
#processing-overlay .proc-title {
  font-size: 18px; font-weight: 600; color: var(--ff-on-surface); margin-bottom: 4px;
}
#processing-overlay .proc-subtitle {
  font-size: 13px; color: var(--ff-on-surface-variant);
}

/* === Toast for share-copied feedback === */
#share-copied-toast {
  position: fixed; bottom: 24px; left: 50%; translate: -50% 0;
  background: rgba(0, 0, 0, 0.8); color: #fff;
  padding: 8px 16px; border-radius: 6px;
  font-size: 13px; z-index: 9999;
}

/* === Report (result page) === */
.report-header { margin: 16px 24px 8px; flex-shrink: 0; }
.report-header h1 { font-size: 20px; font-weight: 600; color: var(--ff-on-surface); }
.report-header .sub { font-size: 13px; color: var(--ff-on-surface-variant); margin-top: 4px; }
.tier-card { margin: 18px 24px; padding: 22px 20px; border-radius: var(--ff-radius-lg); border: 1px solid var(--ff-outline-variant); background: var(--ff-surface-container-lowest); }
.tier-card .tier-label { font-size: 11px; font-family: var(--ff-font-label); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ff-on-surface-variant); }
.tier-card .tier-headline { font-size: 20px; font-weight: 700; color: var(--ff-on-surface); margin: 6px 0 10px; line-height: 1.3; }
.tier-card .tier-body { font-size: 15px; line-height: 1.6; color: var(--ff-on-surface-variant); }
.evidence-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 18px 24px; }
.evidence-card { background: var(--ff-surface-container-lowest); border: 1px solid var(--ff-outline-variant); border-radius: var(--ff-radius-md); padding: 14px 16px; }
.evidence-card .ec-label { font-size: 11px; font-family: var(--ff-font-label); font-weight: 700; letter-spacing: .05em; color: var(--ff-on-surface-variant); }
.evidence-card .ec-value { font-size: 15px; font-weight: 600; color: var(--ff-on-surface); margin-top: 4px; }
.dsm-table { width: 100%; border-collapse: collapse; margin: 18px 24px; font-size: 14px; }
.dsm-table th { text-align: start; padding: 8px 10px; font-size: 11px; font-family: var(--ff-font-label); font-weight: 700; letter-spacing: .05em; color: var(--ff-on-surface-variant); border-bottom: 2px solid var(--ff-outline-variant); }
.dsm-table td { text-align: start; padding: 8px 10px; border-bottom: 1px solid var(--ff-outline-variant); color: var(--ff-on-surface-variant); }
.status-pill { display: inline-block; font-size: 11px; font-family: var(--ff-font-label); font-weight: 700; letter-spacing: .05em; padding: 2px 8px; border-radius: var(--ff-radius-full); border: 1px solid var(--ff-outline-variant); }
.sp-supported { background: var(--ff-secondary-container); color: var(--ff-on-secondary-container); }
.sp-partially_supported { background: #fff3e0; color: #7a3f00; border-color: #ffd9b3; }
.sp-unsupported { background: var(--ff-surface-container-low); color: var(--ff-on-surface-variant); }
.sp-uncertain { background: var(--ff-error-container); color: var(--ff-on-error-container); }
.tag-block { margin: 18px 24px; }
.tag { display: inline-flex; align-items: center; font-size: 13px; font-weight: 500; padding: 5px 12px; border-radius: var(--ff-radius-full); background: var(--ff-surface-container-low); color: var(--ff-on-surface); border: 1px solid var(--ff-outline-variant); margin: 4px 6px 4px 0; }
html[dir="rtl"] .tag { margin: 4px 0 4px 6px; }
.tag-head { font-weight: 700; cursor: default; opacity: .6; }
.tag-contra { background: var(--ff-error-container); color: var(--ff-on-error-container); }
.criterion-list { margin: 0 24px; }
.criterion-group-title { font-size: 12px; font-family: var(--ff-font-label); font-weight: 700; letter-spacing: .05em; color: var(--ff-on-surface-variant); margin: 18px 0 6px; }
.criterion-item { margin-bottom: 4px; }
.ci-head { display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding: 10px 0; border-bottom: 1px solid var(--ff-outline-variant); }
html[dir="rtl"] .ci-head { flex-direction: row-reverse; }
.ci-head .ci-id { font-size: 13px; font-family: var(--ff-font-label); font-weight: 700; letter-spacing: .05em; color: var(--ff-on-surface-variant); }
.ci-head .ci-meta { display: inline-flex; align-items: center; gap: 8px; }
.ci-head .ci-conf { font-size: 11px; color: var(--ff-on-surface-variant); }
.ci-head .ci-toggle { font-size: 12px; color: var(--ff-on-surface-variant); opacity: .6; }
.ci-body { overflow: hidden; max-height: 0; transition: max-height .2s ease; }
.ci-body.open { max-height: 2000px; }
.ci-details { padding: 8px 0 8px; }
.ci-row-label { display: inline-block; font-size: 11px; font-family: var(--ff-font-label); font-weight: 700; letter-spacing: .05em; color: var(--ff-on-surface-variant); margin-inline-end: 6px; }
.ci-details ul { margin: 4px 0; padding-inline-start: 18px; }
html[dir="rtl"] .ci-details ul { padding-inline-start: 0; padding-inline-end: 18px; }
.ci-details ul li { margin: 2px 0; }
.report-footer { margin: 18px 24px; text-align: center; }
.report-footer .quiet { font-size: 11px; font-family: var(--ff-font-label); letter-spacing: .05em; color: var(--ff-on-surface-variant); }
.back-btn { display: inline-block; margin: 8px 0; padding: 10px 22px; background: var(--ff-secondary); color: var(--ff-on-secondary); border: none; border-radius: var(--ff-radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; font-family: var(--ff-font-body); transition: opacity .15s ease; }
.back-btn:hover { opacity: .85; }

/* === Collapsible report details section === */
.details-toggle { padding: 14px 24px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--ff-outline-variant); background: var(--ff-surface-container-low); }
html[dir="rtl"] .details-toggle { flex-direction: row-reverse; }
.details-toggle .dt-label { font-size: 14px; font-weight: 600; color: var(--ff-on-surface); }
.details-toggle .dt-sub { font-size: 12px; color: var(--ff-on-surface-variant); margin-top: 2px; }
.details-toggle .dt-chevron { font-size: 18px; color: var(--ff-on-surface-variant); line-height: 1; font-family: 'Material Symbols Outlined', sans-serif; transition: opacity .15s ease; }
.details-content { overflow: hidden; max-height: 0; transition: max-height .3s ease; }
.details-content.open { max-height: 10000px; }

/* === Result action bar (print / share) === */
.result-actions { margin: 12px 24px 0; display: flex; gap: 10px; flex-wrap: wrap; }
.result-action { flex: 1 1 0; min-width: 120px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; background: var(--ff-secondary); color: var(--ff-on-secondary); border: 1px solid var(--ff-secondary); border-radius: var(--ff-radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .15s ease, background .15s ease; font-family: inherit; }
.result-action:hover { opacity: .85; background: var(--ff-primary); color: var(--fff, var(--ff-on-primary)); border-color: var(--ff-primary); }
.result-action:active { opacity: .7; }
.result-action .ra-icon { font-size: 20px; line-height: 1; font-family: 'Material Symbols Outlined', sans-serif; }
html[dir="rtl"] .result-actions { direction: ltr; }
@media (min-width: 480px) {
  .result-actions { justify-content: flex-start; }
}

/* === Print styles (A4 report output) === */
@page {
  size: A4;
  margin: 0;
}
@media print {
  html, body {
    height: auto;
    -webkit-print-color-adjust: exact;
    color-adjust: exact;
  }
  body {
    background: white;
    color: black;
    font-size: 12pt;
    line-height: 1.5;
    padding: 20mm;
    box-sizing: border-box;
  }
  .device {
    box-shadow: none;
    width: auto;
    height: auto;
    overflow: visible;
    background: white;
    border: none;
    padding: 0;
  }
  #messages {
    overflow: visible;
    -webkit-overflow-scrolling: auto;
    padding: 0;
  }
  .hd-brand, .hd-sub, .progress-wrap, .stage-banner, #input-slot {
    display: none !important;
  }
  .report-header {
    margin: 0 0 18pt 0;
    flex-shrink: 0;
  }
  .report-header h1 {
    font-size: 18pt;
    font-weight: 700;
    color: black;
    margin: 0 0 4pt 0;
  }
  .report-header .sub {
    font-size: 10pt;
    color: #45464d;
    margin-top: 2pt;
  }
  .tier-card {
    margin: 18pt 0;
    padding: 16pt 14pt;
    border: 1pt solid #c6c6cd;
    border-radius: 6pt;
    background: #ffffff;
    page-break-inside: avoid;
  }
  .tier-card .tier-label {
    font-size: 8pt;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #45464d;
  }
  .tier-card .tier-headline {
    font-size: 14pt;
    font-weight: 700;
    margin: 6pt 0 10pt;
  }
  .tier-card .tier-body {
    font-size: 11pt;
    line-height: 1.6;
    color: #45464d;
  }
  .evidence-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12pt;
    margin: 18pt 0;
  }
  .evidence-card {
    background: #ffffff;
    border: 1pt solid #c6c6cd;
    border-radius: 6pt;
    padding: 12pt 14pt;
  }
  .evidence-card .ec-label {
    font-size: 8pt;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #45464d;
  }
  .evidence-card .ec-value {
    font-size: 11pt;
    font-weight: 600;
    margin-top: 4pt;
  }
  .dsm-table {
    width: 100%;
    border-collapse: collapse;
    margin: 18pt 0;
    font-size: 10pt;
    page-break-inside: avoid;
  }
  .dsm-table th {
    text-align: start;
    padding: 6pt 8pt;
    font-size: 8pt;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #45464d;
    border-bottom: 2pt solid #c6c6cd;
  }
  .dsm-table td {
    text-align: start;
    padding: 6pt 8pt;
    border-bottom: 1pt solid #c6c6cd;
    color: #45464d;
  }
  .status-pill {
    display: inline-block;
    font-size: 8pt;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 2pt 8pt;
    border-radius: 999px;
    border: 1pt solid #c6c6cd;
  }
  .sp-supported { background: #2e7d32; color: white; }
  .sp-partially_supported { background: #ef6c00; color: white; }
  .sp-unsupported { background: #eeeeee; color: #45464d; }
  .sp-uncertain { background: #c62828; color: white; }
  .tag-block {
    margin: 18pt 0;
  }
  .tag {
    display: inline-block;
    font-size: 9pt;
    font-weight: 500;
    padding: 4pt 10pt;
    border-radius: 999px;
    background: #e5eeff;
    color: #0b1c30;
    border: 1pt solid #c6c6cd;
    margin: 3pt 6pt 3pt 0;
  }
  html[dir="rtl"] .tag { margin: 3pt 0 3pt 6pt; }
  .tag-head { font-weight: 700; opacity: 0.6; }
  .tag-contra { background: #ffebee; color: #c62828; }
  .criterion-list {
    margin: 0;
    page-break-inside: avoid;
  }
  .criterion-group-title {
    font-size: 9pt;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #45464d;
    margin: 18pt 0 6pt;
  }
  .criterion-item {
    margin-bottom: 8pt;
    page-break-inside: avoid;
  }
  .ci-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8pt 0;
    border-bottom: 1pt solid #c6c6cd;
  }
  html[dir="rtl"] .ci-head { flex-direction: row-reverse; }
  .ci-head .ci-id {
    font-size: 10pt;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #45464d;
  }
  .ci-head .ci-meta { display: inline-flex; align-items: center; gap: 6pt; }
  .ci-head .ci-conf { font-size: 8pt; color: #45464d; }
  .ci-head .ci-toggle { font-size: 10pt; color: #45464d; opacity: 0.6; display: none; }
  .ci-body {
    overflow: visible;
    max-height: none !important;
    margin-bottom: 6pt;
  }
  .ci-details { padding: 6pt 0; }
  .ci-row-label {
    display: inline-block;
    font-size: 8pt;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #45464d;
    margin-inline-end: 6pt;
  }
  .ci-details ul { margin: 4pt 0; padding-inline-start: 14pt; }
  html[dir="rtl"] .ci-details ul { padding-inline-start: 0; padding-inline-end: 14pt; }
  .ci-details ul li { margin: 2pt 0; }
  .report-footer { margin: 18pt 0 0; text-align: center; }
  .report-footer .back-btn { display: none !important; }
  .report-footer .quiet {
    font-size: 9pt;
    font-family: var(--ff-font-label);
    letter-spacing: 0.05em;
    color: #45464d;
    text-align: center;
  }
  .details-toggle {
    display: none !important;
  }
  .details-content {
    max-height: none !important;
    overflow: visible;
  }
  .details-content.open { max-height: none !important; }
  .result-actions { display: none !important; }
  #processing-overlay { display: none !important; }
  html[dir="rtl"] body { text-align: right; }
  body * {
    -webkit-print-color-adjust: exact;
    color-adjust: exact;
  }
}

/* === Buttons (header secondary, resume banner primary/danger, etc.) === */
.primary { padding: 12px 22px; background: var(--ff-primary); color: var(--ff-on-primary); border: none; border-radius: var(--ff-radius-sm); font-size: 16px; font-weight: 700; line-height: 24px; cursor: pointer; white-space: nowrap; transition: opacity .15s ease; font-family: inherit; }
.primary:hover { opacity: .85; }
.primary:disabled { opacity: .45; cursor: not-allowed; background: var(--ff-outline); color: var(--ff-on-surface-variant); }
.primary.danger { background: var(--ff-error); color: var(--ff-on-primary); }
.primary.danger:hover { opacity: .85; }
.secondary { background: transparent; color: var(--ff-secondary); border: 1px solid var(--ff-secondary); border-radius: var(--ff-radius-sm); padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .15s ease; font-family: inherit; }
.secondary:hover { opacity: .8; }
.secondary.soft { background: transparent; color: var(--ff-on-surface-variant); border: 1px solid var(--ff-outline-variant); font-size: 13px; font-weight: 500; }
  .secondary.soft:hover { opacity: .7; }

/* === Resume / destructive-confirmation banner === */
.resume-banner { margin: 12px 24px; padding: 16px 18px; border-radius: var(--ff-radius-lg); background: var(--ff-surface-container-low); border: 1px solid var(--ff-outline-variant); }
.resume-banner .resume-title { font-size: 15px; font-weight: 700; color: var(--ff-on-surface); margin-bottom: 6px; }
.resume-banner .resume-body { font-size: 13px; color: var(--ff-on-surface-variant); margin-bottom: 12px; line-height: 1.5; }
.resume-banner .resume-actions { display: inline-flex; gap: 10px; flex-wrap: wrap; }
html[dir="rtl"] .resume-actions { flex-direction: row-reverse; justify-content: flex-end; }

/* === Mobile === */
@media (max-width: 400px) {
  .device { width: 100%; height: 100vh; box-shadow: none; }
  #messages { padding: 8px var(--ff-mobile-margin); }
  .hd-brand { padding: 36px var(--ff-mobile-margin) 12px; }
  .hd-sub { padding: 0 var(--ff-mobile-margin) 8px; }
  .progress-wrap { padding: 0 var(--ff-mobile-margin) 8px; }
  .stage-banner { margin: 6px var(--ff-mobile-margin) 10px; }
  .evidence-grid, .dsm-table, .tag-block, .criterion-list, .tier-card, .report-header, .report-footer { margin: 18px var(--ff-mobile-margin); }
  .ci-details ul { padding-inline-start: 16px; }
  html[dir="rtl"] .ci-details ul { padding-inline-start: 0; padding-inline-end: 16px; }
  .input-area { padding: 12px var(--ff-mobile-margin) 20px; }
}
</style>
</head>
<body>
<div class="device" id="app">
  <div id="header-slot"></div>
  <div id="progress-slot"></div>
  <div id="messages"></div>
  <div id="input-slot"></div>
</div>
<div id="processing-overlay" hidden>
  <div class="proc-spinner"></div>
  <div class="proc-title" id="proc-title"></div>
  <div class="proc-subtitle" id="proc-subtitle"></div>
</div>
<script src="/stage2-language.js"></script>
<script>
/* ================= state ================= */
const STATE = {
  id: null, lang: 'en', messages: [], banner: null, report: null,
  progress: { stage: 'ADULT_SYMPTOMS', label: 'ADULT_SYMPTOMS', completed: 0, total: 18, pct: 0, current: null, lang: 'en' },
  openCriteria: new Set(),
  showResumeBanner: false,
  resetConfirm: false,
  questionKind: null,
  detailsExpanded: false,
};
// Canonical resume reference: only the session id is persisted. Language is NEVER
// stored client-side — it is locked at Stage 1 and read solely from the server.
const STORAGE_SESSION = 'adhd_stage2_session';
const STORAGE_TRANSCRIPT = 'adhd_stage2_transcript';
const FRESH_FLAG = 'adhd_stage2_just_created';
const RESUME_CONFIRMED = 'adhd_stage2_resume_confirmed';
const ellipsisSvg = '<svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/></svg>';

function api(path, opts) {
  const o = Object.assign({ headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin' }, opts || {});
  if (o.body !== undefined && typeof o.body === 'object') o.body = JSON.stringify(o.body);
  return fetch(path, o).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

// Display history only. Language is intentionally NOT persisted here (server is canonical).
function persistTranscript() {
  if (!STATE.id) return;
  try { localStorage.setItem(STORAGE_TRANSCRIPT, JSON.stringify({ id: STATE.id, messages: STATE.messages, progress: STATE.progress })); } catch (e) {}
}
function readTranscript() {
  try {
    const raw = localStorage.getItem(STORAGE_TRANSCRIPT);
    if (!raw) return null;
    const t = JSON.parse(raw);
    if (t && t.id === STATE.id) return t;
    return null;
  } catch (e) { return null; }
}
function clearAllStorage() {
  localStorage.removeItem(STORAGE_SESSION);
  localStorage.removeItem(STORAGE_TRANSCRIPT);
  sessionStorage.removeItem(FRESH_FLAG);
  sessionStorage.removeItem(RESUME_CONFIRMED);
}
function clearResume() { clearAllStorage(); }

function applyLang() {
  window.STAGE2_STATE.lang = STATE.lang;
  document.documentElement.lang = STATE.lang;
  document.documentElement.dir = typeof t2 === 'function' ? t2().dir : (STATE.lang === 'fa' ? 'rtl' : 'ltr');
  document.title = (typeof t2 === 'function' && t2().title) || 'ADHD Assessment — Symptom Interview';
}

function g() { return (typeof t2 === 'function') ? t2() : {}; }
function shortCid(cid) {
  if (!cid) return '';
  const m = cid.match(/(INATT|HYPERR)_?(\d+)/);
  return m ? (cid.indexOf('INATT') > -1 ? 'I' : 'H') + m[2] : cid;
}
function stageLabelOf(stage) { const gg = g(); return (gg.stageLabels && gg.stageLabels[stage]) || (gg.brand && stage) || stage; }
function stageProgressLabel(label) {
  if (label === 'REPORT') return stageProgressLabel('DIFFERENTIAL');
  const gg = g(); return (gg.stageProgress && gg.stageProgress[label]) || stageLabelOf(label);
}
function statusPill(status) {
  const gg = g(); const rr = gg.result || {};
  const map = { supported: 'sp-supported', partially_supported: 'sp-partially_supported', unsupported: 'sp-unsupported', not_supported: 'sp-unsupported', uncertain: 'sp-uncertain' };
  const cls = map[status] || 'sp-unsupported';
  const key = (status === 'not_supported' || !status) ? 'unsupported' : status;
  const lbl = (rr.statusLabels && rr.statusLabels[key]) || status || '—';
  return '<span class="status-pill ' + cls + '">' + esc(lbl) + '</span>';
}
function onsetLabel(rating) {
  const gg = g(); const rr = gg.result || {};
  return rating ? ((rr.onsetLabels && rr.onsetLabels[rating]) || rating) : '—';
}
function durationLabel(rating) {
  const gg = g(); const rr = gg.result || {};
  return rating ? ((rr.durationLabels && rr.durationLabels[rating]) || rating) : '—';
}
function evCard(label, valueHtml) {
  return '<div class="evidence-card"><div class="ec-label">' + esc(label) + '</div><div class="ec-value">' + valueHtml + '</div></div>';
}

/* === Header (brand + compact overflow menu for non-primary actions) === */
// Language is locked at Stage 1 onboarding and is intentionally NOT exposed as a control on
// Stage 2+. The header stays focus-first: brand title + a single overflow control that hosts
// non-primary actions ("Start new assessment"). Starting over still requires destructive
// confirmation (see startNewAssessment -> confirmReset).
function renderHeader() {
  const box = byId('header-slot'); if (!box) return;
  const gg = g();
  box.innerHTML =
    '<header class="hd-brand"><h1>' + esc(gg.brand || 'ADHD Self-Screening') + '</h1>' +
    '<div class="hd-actions">' +
      '<button type="button" id="header-overflow-btn" class="overflow" data-action="toggleHeaderMenu" aria-haspopup="true" aria-expanded="false" aria-label="' + esc(gg.moreLabel) + '">' + ellipsisSvg + '</button>' +
      '<div id="header-menu" class="header-menu" hidden>' +
        '<button type="button" class="header-menu-item" data-action="startNew">' + esc(gg.startNewLabel) + '</button>' +
      '</div></div></header>';
  closeHeaderMenu();
}
let headerMenuOpen = false;
// Anchor the dropdown to the trigger button, relative to the brand bar (position:absolute,
// .hd-brand is the positioned containing block). This keeps the menu under the ⋯ button and
// inside the device in both LTR and RTL, flipping away from an edge when the menu would overflow.
function positionHeaderMenu() {
  const btn = document.getElementById('header-overflow-btn');
  const menu = document.getElementById('header-menu');
  if (!btn || !menu) return;
  const brand = document.querySelector('.hd-brand');
  if (!brand) return;
  const brandRect = brand.getBoundingClientRect();
  const b = btn.getBoundingClientRect();
  const isRtl = document.documentElement.dir === 'rtl';
  menu.style.position = 'absolute';
  if (isRtl) {
    // RTL: align menu's right edge with the button's right edge (logical "end" edge)
    menu.style.right = Math.round(brandRect.right - b.right) + 'px';
    menu.style.left = 'auto';
  } else {
    menu.style.left = Math.round(b.left - brandRect.left) + 'px';
  }
  menu.style.top = Math.round(b.top - brandRect.top + b.height) + 'px';
  let mr = menu.getBoundingClientRect();
  // Edge-flip: if menu overflows the brand bar on the opening side, flip to the other edge.
  if (isRtl) {
    const overflowLeft = brandRect.left - mr.left;
    if (overflowLeft > 0) {
      menu.style.right = 'auto';
      menu.style.left = Math.round(b.left - brandRect.left) + 'px';
      mr = menu.getBoundingClientRect();
    }
  } else {
    const overflowRight = mr.right - brandRect.right;
    if (overflowRight > 0) {
      const flipped = b.right - brandRect.left - mr.width;
      menu.style.left = Math.round(Math.max(0, flipped)) + 'px';
      mr = menu.getBoundingClientRect();
    }
  }
  const vh = Math.max(document.documentElement.clientHeight, window.innerHeight || 0);
  if (mr.bottom > vh) {
    menu.style.top = Math.round(b.top - brandRect.top - mr.height) + 'px';
  }
}
function toggleHeaderMenu() {
  headerMenuOpen = !headerMenuOpen;
  const btn = document.getElementById('header-overflow-btn');
  const menu = document.getElementById('header-menu');
  if (btn && menu) { menu.hidden = !headerMenuOpen; btn.setAttribute('aria-expanded', String(headerMenuOpen)); }
  if (headerMenuOpen) positionHeaderMenu();
}
function closeHeaderMenu() {
  headerMenuOpen = false;
  const btn = document.getElementById('header-overflow-btn');
  const menu = document.getElementById('header-menu');
  if (btn) btn.setAttribute('aria-expanded', 'false');
  if (menu) menu.hidden = true;
}

/* === Stage sub-header + progress === */
function renderProgress() {
  const slot = byId('progress-slot'); if (!slot) return;
  const p = STATE.progress || {};
  const gg = g();
  let stageNum, title;
  if (STATE.report) {
    stageNum = stageProgressLabel('DIFFERENTIAL');
    title = gg.result && gg.result.summary ? gg.result.summary : stageLabelOf(p.label);
  } else {
    stageNum = stageProgressLabel(p.label);
    title = stageLabelOf(p.label);
  }
  const pct = p.pct || 0;
  const meta = p.total ? (num(p.completed || 0) + ' / ' + num(p.total)) : '';
  slot.innerHTML =
    '<div class="hd-sub">' +
      '<div class="stage-row"><span class="stage-num">' + esc(stageNum) + '</span></div>' +
      '<h2>' + esc(title) + '</h2>' +
      '<div class="sub-text">' + esc(gg.headerSubtitle || '') + '</div>' +
    '</div>' +
    '<div class="progress-wrap">' +
      '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="progress-meta"><span class="progress-label">' + esc(gg.progressLabel || '') + '</span><span>' + esc(meta) + '</span></div>' +
    '</div>';
  byId('header-slot') && updateProgressFill();
}
function updateProgressFill() {
  const pct = (STATE.progress && STATE.progress.pct) || 0;
  const fill = document.querySelector('.progress-fill');
  if (fill) fill.style.width = pct + '%';
}

/* === Messages (scrollable; persistent input never touched here) === */
function resumeBannerHtml() {
  // Two-step destructive confirmation, localized per canonical STATE.lang.
  const gg = g();
  if (STATE.resetConfirm) {
    return '<div class="resume-banner">' +
      '<div class="resume-title">' + esc(gg.startOverConfirm) + '</div>' +
      '<div class="resume-body">' + esc(gg.startOverBody) + '</div>' +
      '<div class="resume-actions">' +
        '<button type="button" class="secondary soft" data-action="cancelReset">' + esc(gg.continueBtn) + '</button>' +
        '<button type="button" class="primary danger" data-action="confirmReset">' + esc(gg.startOverBtn) + '</button>' +
      '</div></div>';
  }
  return '<div class="resume-banner">' +
    '<div class="resume-title">' + esc(gg.resumeConfirm) + '</div>' +
    '<div class="resume-body">' + esc(gg.resumeConfirmBody) + '</div>' +
    '<div class="resume-actions">' +
      '<button type="button" class="secondary soft" data-action="resumeStartOver">' + esc(gg.startOverBtn) + '</button>' +
      '<button type="button" class="primary" data-action="resumeContinue">' + esc(gg.continueBtn) + '</button>' +
    '</div></div>';
}
function renderMessages(atBottom) {
  const box = byId('messages'); if (!box) return;
  if (STATE.report) { box.innerHTML = ''; return; }
  if (atBottom === undefined) atBottom = (box.scrollHeight - box.scrollTop - box.clientHeight) < 24;
  let html = '';
  if (STATE.showResumeBanner) html += resumeBannerHtml();
  if (STATE.banner) html += '<div class="stage-banner">' + esc(STATE.banner) + '</div>';
  for (let i = 0; i < STATE.messages.length; i++) {
    const m = STATE.messages[i];
    let classes = m.role === 'user' ? 'msg user' : 'msg ai';
    if (m.kind === 'transition' || m.kind === 'error' || m.kind === 'completed') classes += ' transition';
    else if (m.kind === 'criterion_done') classes += ' criterion-done';
    else if (m.kind === 'error') classes += ' error';
    else if (m.kind === 'processing') classes += ' processing';
    const badge = (m.cid && (m.kind === 'question' || m.kind === 'criterion_done' || m.kind === 'followup'))
      ? '<span class="badge">' + esc(shortCid(m.cid)) + '</span> ' : '';
    html += '<div class="' + classes + '"><div class="qs">' + badge + esc(m.text) + '</div></div>';
  }
  box.innerHTML = html || ('<div class="quiet" style="margin:12px 0">' + esc(g().loading) + '</div>');
  persistTranscript();
  if (atBottom) {
    scrollToLastMessage();
  }
  announce();
}

function scrollToLastMessage() {
  const box = byId('messages'); if (!box) return;
  const lastMsg = box.querySelector('.msg:last-child');
  if (!lastMsg) return;
  const inputSlot = byId('input-slot');
  const inputHeight = inputSlot ? inputSlot.offsetHeight : 0;
  const isRtl = document.documentElement.dir === 'rtl';
  if (isRtl) {
    box.scrollLeft = 0;
  }
  lastMsg.scrollIntoView({ block: 'end', inline: 'nearest', behavior: 'auto' });
  requestAnimationFrame(function () {
    const target = box.scrollHeight - box.clientHeight;
    const inputOffset = inputHeight + 16;
    const desired = target + inputOffset;
    if (box.scrollTop < desired) {
      box.scrollTop = desired;
    }
  });
}

function announce() {
  let ann = byId('a11y-announcer');
  if (!ann) {
    ann = document.createElement('div');
    ann.id = 'a11y-announcer';
    ann.setAttribute('aria-live', 'polite');
    ann.setAttribute('aria-atomic', 'true');
    ann.style.cssText = 'position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden;';
    document.body.appendChild(ann);
  }
  const last = STATE.messages.length ? STATE.messages[STATE.messages.length - 1] : null;
  ann.textContent = (last && last.role === 'ai') ? last.text : '';
}

/* === Persistent input (built once; never destroyed -> keyboard/focus preserved) === */
// Two input modes: frequency buttons for 'core' questions, textarea for free-text questions.
// Both DOM subtrees are created once and toggled via style.display to preserve the textarea's
// focus/cursor state across re-renders (renderAll calls renderInput after every turn).
// A brief opacity fade smooths the transition between chip and textarea modes.
let _lastInputCore = null;
function renderInput() {
  const slot = byId('input-slot'); if (!slot) return;
  if (STATE.report || STATE.showResumeBanner) { slot.style.display = 'none'; return; }
  slot.style.display = '';
  if (!slot.dataset.bound) {
    slot.dataset.bound = 'true';
    slot.innerHTML = '<div class="input-area">' +
      '<div class="freq-options" id="freq-options"></div>' +
      '<textarea id="ta" rows="4" autocomplete="off" aria-label="Your answer"></textarea>' +
      '<button id="send" type="button">' + esc(g().sendBtn) + '</button>' +
      '</div><div class="input-hint">' + esc(g().headerSubtitle) + '</div>';;
    const ta = byId('ta'); const btn = byId('send');
    ta.addEventListener('input', function () { btn.disabled = !ta.value.trim(); });
    ta.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!btn.disabled) submit(); } });
    btn.addEventListener('click', submit);
  }
  const ta = byId('ta'); const btn = byId('send');
  const freqBox = byId('freq-options');
  const isCore = STATE.questionKind === 'core';
  const modeChanged = _lastInputCore !== isCore;
  if (freqBox) {
    if (isCore) {
      const opts = g().frequencyOpts || [];
      let html = '';
      for (let i = 0; i < opts.length; i++) {
        html += '<button type="button" class="freq-opt" data-freq="' + esc(opts[i]) + '">' + esc(opts[i]) + '</button>';
      }
      freqBox.innerHTML = html;
      freqBox.style.display = 'flex';
      if (modeChanged) { freqBox.style.opacity = '0'; requestAnimationFrame(function () { if (freqBox) freqBox.style.opacity = '1'; }); }
    } else {
      freqBox.innerHTML = '';
      freqBox.style.display = 'none';
    }
  }
  if (ta) {
    if (isCore) {
      ta.style.display = 'none';
    } else {
      ta.style.display = '';
      ta.placeholder = g().placeholder;
      if (modeChanged) { ta.style.opacity = '0'; requestAnimationFrame(function () { if (ta) ta.style.opacity = '1'; }); }
    }
  }
  if (btn) {
    btn.textContent = g().sendBtn;
    btn.disabled = isCore ? false : !ta.value.trim();
    btn.style.display = isCore ? 'none' : '';
  }
  const hint = slot.querySelector('.input-hint');
  if (hint) hint.textContent = g().headerSubtitle;
   if (isCore && freqBox) {
    const first = freqBox.querySelector('.freq-opt');
    if (first) first.focus();
  } else if (ta && !isCore) {
    ta.focus();
  }
  _lastInputCore = isCore;
}

/* === Report result actions (print / share) === */
function buildResultActions() {
  const t = t2().result || {};
  const shareSupported = typeof navigator !== 'undefined' && typeof navigator.share === 'function';
  let html = '<div class="result-actions">';
  html += '<button type="button" class="result-action" data-action="printReport"><span class="ra-icon">download</span> ' + esc(t.printBtn) + '</button>';
  if (shareSupported) {
    html += '<button type="button" class="result-action" data-action="shareReport"><span class="ra-icon">share</span> ' + esc(t.shareBtn) + '</button>';
  }
  html += '</div>';
  return html;
}
function printReport() { window.print(); }
function shareReport() {
  const t = t2().result || {};
  const summary = document.querySelector('.tier-headline')?.textContent || '';
  const rec = document.querySelector('.tier-body')?.textContent || '';
  const shareText = summary + ' — ' + rec + ' ' + t.notADiagnosis + ' ' + t.shareSource;
  if (typeof navigator !== 'undefined' && typeof navigator.share === 'function') {
    navigator.share({
      title: t.shareTitle,
      text: shareText,
    }).catch(function () {});
  } else {
    copyToClipboard(shareText);
  }
}

function copyToClipboard(text) {
  if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () {
      showShareCopied();
    }).catch(function () {
      fallbackCopyText(text);
    });
  } else {
    fallbackCopyText(text);
  }
}

function fallbackCopyText(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:absolute;left:-9999px;top:0;';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  showShareCopied();
}

function showShareCopied() {
  const gg = g();
  const el = document.createElement('div');
  el.textContent = gg.shareCopied;
  el.style.cssText = 'position:fixed;bottom:24px;left:50%;translate:-50% 0;background:rgba(0,0,0,0.8);color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;z-index:9999;';
  document.body.appendChild(el);
  setTimeout(function () {
    if (el.parentNode) el.parentNode.removeChild(el);
  }, 2000);
}

/* === Report (result page) === */
function buildReport(r) {
  const gg = t2(); const t = gg.result || {};
  const R = r || {};
  const adult = R.adult_symptoms || {};
  const dur = R.duration_persistence || {};
  const setts = R.settings || {};
  const imp = R.impairment || {};
  const on = R.childhood_onset || {};
  const dsm = R.dsm5_criteria || {};
  const contra = R.contradictions || { list: [] };
  const diff = R.differentials || { list: [] };
  const order = ['A_symptom_count', 'B_duration', 'C_onset', 'D_settings', 'E_impairment', 'F_not_better_explained'];
  let h = '';

  h += '<div class="report-header"><h1>' + esc(t.summary) + '</h1>' +
    '<div class="sub">' + esc(t.notADiagnosis) + ' · ' + esc(t.subtitle) + '</div></div>';

  const tierKey = R.tier || 'Insufficient';
  h += '<div class="tier-card">' +
    '<div class="tier-label">' + esc(t.notADiagnosis) + '</div>' +
    '<div class="tier-headline">' + esc(t.tierLabels ? t.tierLabels[tierKey] : tierKey) + '</div>' +
    '<div class="tier-body">' + esc(R.recommendation || '') + '</div>' +
    '</div>';

  const detailsOpen = STATE.detailsExpanded;
  const detailsId = 'report-details-' + STATE.id;
  h += '<div class="details-toggle" role="button" tabindex="0" aria-expanded="' + (detailsOpen ? 'true' : 'false') + '" aria-controls="' + detailsId + '" data-action="toggleDetails">' +
    '<div><div class="dt-label">' + esc(t.detailsLabel) + '</div><div class="dt-sub">' + esc(t.detailsSubtitle) + '</div></div>' +
     '<span class="dt-chevron" aria-hidden="true">' + detailsChevron(detailsOpen) + '</span>' +
    '</div>';
  h += '<div class="details-content' + (detailsOpen ? ' open' : '') + '" id="' + detailsId + '">';

  h += '<div class="evidence-grid">';
  h += evCard(t.grid.pattern, t.patternLabels ? (t.patternLabels[adult.pattern] || adult.pattern) : adult.pattern);
  h += evCard(t.grid.symptoms, num(adult.inattentive_supported || 0) + ' / ' + num(adult.hyperactive_supported || 0) + ' ' + esc(t.statusLabels ? t.statusLabels.supported : 'Supported') + ' (\u2265' + num(adult.threshold || 5) + ')');
  h += evCard(t.grid.childhood, onsetLabel(on.rating));
  h += evCard(t.grid.duration, durationLabel(dur.rating));
  h += evCard(t.grid.settings, num(setts.count || 0) + ' (' + esc(setts.multiple_settings ? t.settingsReq : '<2') + ')');
  h += evCard(t.grid.impairment, num(imp.count || 0) + ' (' + esc(t.impairmentReq) + ')');
  h += '</div>';

  h += '<table class="dsm-table"><thead><tr><th>' + esc(t.criterionCol) + '</th><th>' + esc(t.statusCol) + '</th></tr></thead><tbody>';
  for (let i = 0; i < order.length; i++) {
    const k = order[i]; const v = dsm[k] || 'not_supported';
    h += '<tr><td>' + esc(t.dsmLabels ? t.dsmLabels[k] : k) + '</td><td>' + statusPill(v) + '</td></tr>';
  }
  h += '</tbody></table>';

  h += '<div class="tag-block">';
  if (contra.list && contra.list.length) {
    h += '<span class="tag tag-head">' + esc(t.contradictions) + '</span>';
    for (let i = 0; i < contra.list.length; i++) h += '<span class="tag tag-contra">' + esc(contra.list[i]) + '</span>';
  } else {
    h += '<span class="quiet">' + esc(t.noContradictions) + '</span>';
  }
  h += '</div>';
  h += '<div class="tag-block">';
  if (diff.list && diff.list.length) {
    h += '<span class="tag tag-head">' + esc(t.differentials) + '</span>';
    for (let i = 0; i < diff.list.length; i++) h += '<span class="tag">' + esc(diff.list[i]) + '</span>';
  } else {
    h += '<span class="quiet">' + esc(t.noDifferentials) + '</span>';
  }
  h += '</div>';

  const per = R.per_criterion || [];
  const inatt = []; const hyper = [];
  for (let i = 0; i < per.length; i++) { (per[i].domain === 'hyperactive' ? hyper : inatt).push(per[i]); }
  h += '<div class="criterion-list">';
  h += '<div class="criterion-group-title">' + esc(t.groupInattentive) + '</div>';
  for (let i = 0; i < inatt.length; i++) h += criterionItem(inatt[i]);
  h += '<div class="criterion-group-title">' + esc(t.groupHyperactive) + '</div>';
  for (let i = 0; i < hyper.length; i++) h += criterionItem(hyper[i]);
  h += '</div>';

  if (R.stage2_only) h += '<div class="quiet" style="margin:0 24px 12px">' + esc(R.stage2_only) + '</div>';

   h += '</div>'; /* close details-content */

  h += buildResultActions();

  h += '<div class="report-footer">' +
    '<button type="button" class="back-btn" data-action="backToStart">' + esc(t.backToStart) + '</button>' +
    '<div class="quiet">' + esc(R.disclaimer || (t.footer || '')) + '</div>' +
    '</div>';
  return h;
}

function criterionItem(c) {
  const t = t2().result || {};
  const open = STATE.openCriteria.has(c.criterion);
  let body = '<div class="ci-details">';
  const ex = c.example ? esc(c.example) : ('<span class="quiet">' + esc(t.noExample) + '</span>');
  body += '<div><span class="ci-row-label">' + esc(t.exampleLabel) + ':</span> ' + ex + '</div>';
  if (c.contexts && c.contexts.length) body += '<div><span class="ci-row-label">' + esc(t.contextsLabel) + ':</span> ' + esc(c.contexts.join(', ')) + '</div>';
  if (c.counter_evidence && c.counter_evidence.length) body += '<div><span class="ci-row-label">' + esc(t.counterLabel) + ':</span> <ul>' + c.counter_evidence.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
  if (c.evidence && c.evidence.length) body += '<div><span class="ci-row-label">' + esc(t.evidenceCol) + ':</span> <ul>' + c.evidence.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
  if (c.uncertainty) body += '<div><span class="ci-row-label">' + esc(t.uncertaintyLabel) + ':</span> ' + esc(c.uncertainty) + '</div>';
  body += '</div>';
  return '<div class="criterion-item">' +
    '<div class="ci-head" data-cid="' + esc(c.criterion) + '" tabindex="0" role="button" aria-expanded="' + (open ? 'true' : 'false') + '">' +
      '<span class="ci-id">' + esc(c.criterion) + '</span>' +
      '<span class="ci-meta">' + statusPill(c.status) +       '<span class="ci-conf">' + esc((t.confidenceLabels && t.confidenceLabels[c.confidence]) || c.confidence || '—') + '</span>' +
      '<span class="ci-toggle">' + esc(open ? t.hideEvidence : t.showEvidence) + '</span></span>' +
    '</div>' +
    '<div class="ci-body' + (open ? ' open' : '') + '" data-cid="' + esc(c.criterion) + '">' + body + '</div>' +
    '</div>';
}

function toggleCriterion(cid) {
  if (!cid) return;
  if (STATE.openCriteria.has(cid)) STATE.openCriteria.delete(cid);
  else STATE.openCriteria.add(cid);
  renderReport();
}

// Returns the correct Material Symbols chevron for the details toggle:
// Expanded → 'expand_more' (down), Collapsed → 'chevron_right' (LTR) / 'chevron_left' (RTL)
function detailsChevron(open) {
  if (open) return 'expand_more';
  return document.documentElement.dir === 'rtl' ? 'chevron_left' : 'chevron_right';
}

function toggleDetails() {
  STATE.detailsExpanded = !STATE.detailsExpanded;
  // Re-render only the details toggle + content to preserve scroll position.
  const box = byId('messages'); if (!box) return;
  const detailsToggle = box.querySelector('.details-toggle');
  if (detailsToggle) detailsToggle.setAttribute('aria-expanded', STATE.detailsExpanded ? 'true' : 'false');
  const chevron = box.querySelector('.dt-chevron');
   if (chevron) chevron.textContent = detailsChevron(STATE.detailsExpanded);
  const content = box.querySelector('.details-content');
  if (content) content.classList.toggle('open', STATE.detailsExpanded);
  announce();
}

function renderReport() {
  const box = byId('messages'); if (!box) return;
  if (!STATE.report) return;
  box.innerHTML = buildReport(STATE.report);
  box.scrollTop = 0;
  const slot = byId('input-slot'); if (slot) slot.style.display = 'none';
  announce();
}

/* === App flow === */
// Entry gate for Stage 2: a session id MUST already exist (created by Stage 1,
// which locked the language). If there is no session, redirect to Stage 1 so the
// user can pick a language and run the screener. Language is read ONLY from the
// server (state.lang) — never from localStorage or the transcript blob.
async function start() {
  const sessId = localStorage.getItem(STORAGE_SESSION);
  const justCreated = sessId && sessionStorage.getItem(FRESH_FLAG) === sessId;
  const resumeParam = new URLSearchParams(location.search).get('resume') === '1';
  const confirmed = sessionStorage.getItem(RESUME_CONFIRMED) === '1';
  if (sessId && justCreated) sessionStorage.removeItem(FRESH_FLAG);
  if (confirmed) sessionStorage.removeItem(RESUME_CONFIRMED);

  // No session at all → must go through Stage 1 to lock a language.
  if (!sessId) { goHome(); return; }

  // Resume the canonical session from the server.
  let st;
  try { st = await api('/api/state/' + sessId); } catch (e) { st = { error: String(e) }; }
  if (!st || st.error) {
    // Stale/corrupt reference → wipe and send back to Stage 1.
    clearAllStorage();
    goHome();
    return;
  }

  STATE.id = sessId;
  STATE.lang = st.lang || 'en';     // canonical, server-only
  applyLang();

  // Restore the display transcript (messages + progress) from the client cache,
  // but only if it belongs to this session.
  const cached = readTranscript();
  STATE.messages = (cached && cached.messages) || [];
  STATE.progress = st.progress || STATE.progress;

  if (st.completed) {
    // Completed → render the report (re-fetched to be canonical).
    await loadReport();
    renderHeader();
    renderProgress();
    renderInput();
    byId('messages') && (byId('messages').innerHTML = '');
    renderReport();
    return;
  }

  // Unfinished assessment. If we have a reconstructed in-flight question from the
  // server, and the last displayed message isn't already it, surface it so the user
  // lands on the exact prompt they were answering.
  if (st.question) {
    const last = STATE.messages.length ? STATE.messages[STATE.messages.length - 1] : null;
    const same = last && last.role === 'ai' && (last.text || '') === (st.question || '');
    // Mid-turn if the last message was a user answer with no following question yet.
    const midTurn = last && last.role === 'user';
    if (!same && (midTurn || STATE.messages.length === 0)) {
      STATE.messages.push({ role: 'ai', kind: (st.pendingKind === 'core' ? 'question' : 'followup'), text: st.question, cid: st.pendingCid });
    }
    STATE.questionKind = st.pendingKind || null;
  } else {
    STATE.questionKind = null;
  }

  renderHeader();
  renderProgress();
  renderMessages();
  renderInput();
  persistTranscript();

  // Show the resume confirmation only for a genuine re-entry (not a fresh start
  // and not a continue-through from Stage 1).
  const showBanner = !justCreated && !resumeParam && !confirmed;
  STATE.showResumeBanner = !!showBanner;
  STATE.resetConfirm = false;
  if (STATE.showResumeBanner) {
    renderMessages();
    renderInput();
  }
  byId('ta') && byId('ta').focus();
}

function goHome() { window.location.href = '/'; }

// Resume confirmation: "Continue where you left off" → dismiss banner, keep state.
function resumeContinue() {
  STATE.showResumeBanner = false;
  STATE.resetConfirm = false;
  renderMessages();
  renderInput();
}

// Resume banner → "Start over" (first step): switch to the destructive confirmation.
function resumeStartOver() {
  STATE.resetConfirm = true;
  renderMessages();
}

function cancelReset() {
  STATE.resetConfirm = false;
  renderMessages();
}

// Destructive reset: wipes the server session + snapshot + all client state,
// then returns to Stage 1 (so language can be re-selected). Enforces "changing
// language requires starting a new assessment from Stage 1."
async function confirmReset() {
  if (!STATE.id) { goHome(); return; }
  try { await api('/api/session/reset', { method: 'POST', body: { id: STATE.id } }); } catch (e) { /* best-effort */ }
  clearAllStorage();
  goHome();
}

// Header "Start new assessment" link → always goes through the destructive confirmation.
async function startNewAssessment() {
  const gg = g();
  if (confirm(gg.startOverConfirm + '\n\n' + gg.startOverBody)) {
    await confirmReset();
  }
}

async function loadReport() {
  const r = await api('/api/report/' + STATE.id).catch(function () { return null; });
  if (r && r.report) { STATE.report = r.report; }
}

function showProcessingOverlay() {
  const overlay = byId('processing-overlay'); if (!overlay) return;
  const tt = byId('proc-title'); const st = byId('proc-subtitle');
  const gg = g(); const rr = gg.result || {};
  if (tt) tt.textContent = gg.reviewingResponses;
  if (st) st.textContent = (rr.processingSubtitle !== undefined ? rr.processingSubtitle : (gg.processingSubtitle || ''));
  byId('messages') && (byId('messages').innerHTML = '');
  byId('input-slot') && (byId('input-slot').style.display = 'none');
  byId('header-slot') && (byId('header-slot').style.display = 'none');
  byId('progress-slot') && (byId('progress-slot').style.display = 'none');
  overlay.hidden = false;
}

function hideProcessingOverlay() {
  const overlay = byId('processing-overlay'); if (!overlay) return;
  overlay.hidden = true;
  byId('header-slot') && (byId('header-slot').style.display = '');
  byId('progress-slot') && (byId('progress-slot').style.display = '');
  byId('input-slot') && (byId('input-slot').style.display = 'none');
}

function renderAll() {
  const box = byId('messages');
  const atBottomBeforeInput = box ? (box.scrollHeight - box.scrollTop - box.clientHeight) < 24 : true;
  renderHeader();
  renderProgress();
  renderInput();
  renderMessages(atBottomBeforeInput);
}

function showError(msg) {
  const box = byId('messages'); if (box) box.innerHTML = '<div class="err">' + esc(msg) + '</div>';
  const slot = byId('input-slot'); if (slot) slot.style.display = 'none';
  renderProgress();
}

async function submit(answer) {
  const ta = byId('ta'); const btn = byId('send');
  if (typeof answer !== 'string') {
    if (!ta || btn.disabled) return;
    answer = ta.value.trim();
    if (!answer) return;
  }
  if (btn.disabled) return;
  if (ta) ta.value = '';
  if (btn) btn.disabled = true;
  STATE.messages.push({ role: 'user', text: answer });
   renderMessages();
  if (ta && STATE.questionKind !== 'core') ta.focus();
  try {
    const res = await api('/api/answer/' + STATE.id, { method: 'POST', body: { answer: answer } });
    if (res.error) { STATE.messages.push({ role: 'ai', kind: 'error', text: g().errorMsg + ': ' + res.error }); renderMessages(); return; }
    if (res.progress) STATE.progress = res.progress;
    if (res.completed && res.report) {
      const finalReport = res.report;
      STATE.progress = res.progress || STATE.progress;
      STATE.banner = null;
      persistTranscript();
      showProcessingOverlay();
      setTimeout(function () {
        STATE.report = finalReport;
        persistTranscript();
        hideProcessingOverlay();
        renderHeader();
        renderProgress();
        renderInput();
        renderReport();
      }, 3000);
      return;
    }
    if (res.transitioned) {
      const nxt = stageLabelOf(res.stage);
      STATE.banner = g().transitionMsg + ' ' + nxt;
      STATE.messages.push({ role: 'ai', kind: 'transition', text: g().transitionMsg + ' ' + nxt });
    } else {
      STATE.banner = null;
    }
    if (res.criterion_done) {
      const status = res.status || 'uncertain';
      const sk = (status === 'not_supported' || !status) ? 'unsupported' : status;
      const rr = g().result || {};
      const slabel = (rr.statusLabels && rr.statusLabels[sk]) || status || '—';
      const shown = (res.evidence && res.evidence.core_answer) ? ' \u2014 ' + res.evidence.core_answer : '';
      STATE.messages.push({ role: 'ai', kind: 'criterion_done', text: '(' + res.criterionId + ' ' + g().criterionRecorded + ' ' + slabel + ')' + shown, cid: res.criterionId });
    }
    if (res.question) {
      STATE.questionKind = res.kind || null;
      STATE.messages.push({ role: 'ai', kind: res.followup ? 'followup' : 'question', text: res.question, cid: res.criterionId });
    } else {
      STATE.questionKind = null;
    }
    renderAll();
    persistTranscript();
    if (ta && STATE.questionKind !== 'core') ta.focus();
  } catch (e) {
    STATE.messages.push({ role: 'ai', kind: 'error', text: g().networkError + ': ' + e.message });
    renderMessages();
  }
}

function onDocClick(e) {
  // Close the header overflow menu when clicking outside it (or its toggle).
  if (headerMenuOpen && !(e.target.closest('#header-menu') || e.target.closest('#header-overflow-btn'))) closeHeaderMenu();
  const freqEl = e.target.closest('.freq-opt');
  if (freqEl) { submit(freqEl.getAttribute('data-freq')); return; }
  const detailsEl = e.target.closest('.details-toggle');
  if (detailsEl) { toggleDetails(); return; }
  const headEl = e.target.closest('.ci-head');
  if (headEl) { toggleCriterion(headEl.getAttribute('data-cid')); return; }
  const actEl = e.target.closest('[data-action]');
  if (actEl) {
    const act = actEl.getAttribute('data-action');
    if (act === 'backToStart') { window.location.href = '/'; return; }
    if (act === 'printReport') { printReport(); return; }
    if (act === 'shareReport') { shareReport(); return; }
    if (act === 'toggleHeaderMenu') { toggleHeaderMenu(); return; }
    if (act === 'resumeContinue') { resumeContinue(); return; }
    if (act === 'resumeStartOver') { resumeStartOver(); return; }
    if (act === 'cancelReset') { cancelReset(); return; }
    if (act === 'confirmReset') { confirmReset(); return; }
    if (act === 'startNew') { closeHeaderMenu(); startNewAssessment(); return; }
  }
}

function onKeyDown(e) {
  if (e.key === 'Escape' && headerMenuOpen) { closeHeaderMenu(); return; }
  const head = e.target.closest('.ci-head');
  if (head && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleCriterion(head.getAttribute('data-cid')); }
  const dt = e.target.closest('.details-toggle');
  if (dt && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleDetails(); }
}

function init() {
  // Stage 2 requires a session that was created on Stage 1 (where the language was
  // locked). No session → no locked language → send the user to Stage 1.
  const sessId = localStorage.getItem(STORAGE_SESSION);
  if (!sessId) {
    window.location.href = '/';
    return;
  }
  wireEvents();
  // Brief loading shell while the server restores canonical state (lang + stage).
  document.documentElement.lang = 'en';
  document.documentElement.dir = 'ltr';
  byId('header-slot') && (byId('header-slot').innerHTML = '<header class="hd-brand"><h1>' + esc(g().brand || 'ADHD Self-Screening') + '</h1></header>');
  byId('messages') && (byId('messages').innerHTML = '<div class="quiet" style="margin:12px 0">' + esc(g().loading) + '</div>');
  const islot = byId('input-slot'); if (islot) islot.style.display = 'none';
  start();
}
function wireEvents() {
  document.addEventListener('click', onDocClick);
  document.addEventListener('keydown', onKeyDown);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
